[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-interpreters"
version = "0.1.0"
description = "Concrete runtime interpreters for Control Plane Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenJ92" }
]
dependencies = [
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/b79a02d1ac8ef987dd34abeb2297a231b109f7a6.zip#subdirectory=control-plane-kit-core",
]

[project.optional-dependencies]
cloudflare = [
  "httpx>=0.28",
]
docker = [
  "docker>=7.1",
  "requests>=2.26.0",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
]
http = [
  "httpx>=0.28",
]
public-dns = [
  "dnspython>=2.7,<3",
  "httpx>=0.28",
]
secret-provider = [
  "httpx>=0.28",
]
gateway = [
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10,<3",
]
test = [
  "control-plane-kit-secrets[test] @ https://github.com/OpenJ92/control-plane-kit-secrets/archive/8273b7de86dcaac254a8fcaca22b2769c5e16a4d.zip",
  "docker>=7.1",
  "requests>=2.26.0",
  "dnspython>=2.7,<3",
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_plane_kit_interpreters = ["py.typed"]
