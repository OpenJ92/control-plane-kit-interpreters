[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-interpreters"
version = "0.1.0"
description = "Concrete runtime interpreters for Control Plane Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenJ92" }
]
dependencies = [
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/d2d81efb4d0f4ec7fd43145317779ed8e324833f.zip#subdirectory=control-plane-kit-core",
]

[project.optional-dependencies]
cloudflare = [
  "httpx>=0.28",
]
docker = [
  "docker>=7.1",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
]
http = [
  "httpx>=0.28",
]
secret-provider = [
  "httpx>=0.28",
]
gateway = [
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10,<3",
]
test = [
  "control-plane-kit-secrets[test] @ https://github.com/OpenJ92/control-plane-kit-secrets/archive/d82c5d7c69546447fd71db76eafdd1492262acdc.zip",
  "docker>=7.1",
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_plane_kit_interpreters = ["py.typed"]
